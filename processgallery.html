  <script>
    (function() {
      function randomBetween(min, max) { return Math.random() * (max - min) + min; }
      function buildPath(width, height) {
        // sweeping arc with slight randomness (only style used)
        var baseline = randomBetween(height * 0.55, height * 0.85);
        var controlY = randomBetween(height * 0.1, height * 0.9);
        var d = "M 0 " + baseline.toFixed(2);
        var midX = width * randomBetween(0.3, 0.6);
        d += " Q " + midX.toFixed(2) + " " + controlY.toFixed(2) + ", " + width.toFixed(2) + " " + baseline.toFixed(2);
        return d;
      }

      function applyScribbles() {
        var links = document.querySelectorAll('header a.scribble-link');
        links.forEach(function(link) {
          var svg = link.querySelector('.scribble-target > svg.scribble-underline');
          if (!svg) return;
          var path = svg.querySelector('path');
          var target = link.querySelector('.scribble-target') || link;
          var rect = target.getBoundingClientRect();
          var width = Math.max(40, rect.width);
          var height = 16;
          svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
          svg.style.width = rect.width + 'px';
          svg.style.height = height + 'px';
          var d = buildPath(width, height);
          path.setAttribute('d', d);
          // prepare draw animation: total length and dash
          var total = path.getTotalLength();
          path.style.strokeDasharray = total;
          path.style.strokeDashoffset = total;
        });
      }

      function regenerateOnHover(e) {
        var link = e.currentTarget;
        var svg = link.querySelector('.scribble-target > svg.scribble-underline');
        if (!svg) return;
        var path = svg.querySelector('path');
        var target = link.querySelector('.scribble-target') || link;
        var rect = target.getBoundingClientRect();
        var width = Math.max(40, rect.width);
        var height = 16;
        var d = buildPath(width, height);
        path.setAttribute('d', d);
        var total = path.getTotalLength();
        path.style.strokeDasharray = total;
        // restart animation by resetting offset and forcing reflow
        path.style.transition = 'none';
        path.style.strokeDashoffset = total;
        path.getBoundingClientRect();
        path.style.transition = '';
        requestAnimationFrame(function(){
          path.style.strokeDashoffset = 0;
        });
      }

      window.addEventListener('load', function() {
        applyScribbles();
        document.querySelectorAll('header a.scribble-link').forEach(function(link){
          link.addEventListener('mouseenter', regenerateOnHover);
        });
      });
      window.addEventListener('resize', function(){
        // debounce
        clearTimeout(window.__scribbleTimer);
        window.__scribbleTimer = setTimeout(applyScribbles, 150);
      });
    })();
  </script>
